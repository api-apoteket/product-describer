version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/scraper", "/scraper/*"]
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: npm
    directories: ["/cloudflare/app", "/cloudflare/engine", "/cloudflare/processor"]
    schedule:
      interval: weekly
    groups:
      worker-dependencies:
        patterns: ["*"]
  - package-ecosystem: docker
    directories: ["/", "/scraper"]
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

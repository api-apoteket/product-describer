python:
  - changed-files:
      - any-glob-to-any-file: ["**/*.py", "**/requirements*.txt"]
javascript:
  - changed-files:
      - any-glob-to-any-file: "cloudflare/**"
tests:
  - changed-files:
      - any-glob-to-any-file: ["tests/**", "scraper/tests/**", "**/*.test.mjs", "**/*.test.ts"]
docker:
  - changed-files:
      - any-glob-to-any-file: ["**/Dockerfile", "docker-compose*.yml"]
github_actions:
  - changed-files:
      - any-glob-to-any-file: ".github/**"
dependencies:
  - changed-files:
      - any-glob-to-any-file: ["**/requirements*.txt", "**/package-lock.json", "**/package.json"]
